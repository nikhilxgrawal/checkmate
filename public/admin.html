<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — SnapGames</title>
  <link rel="stylesheet" href="/style.css?v=11" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand"><a href="/">SNAP<span class="mate">GAMES</span></a>
        <span class="sub">ADMIN CONTROL</span>
      </div>
      <nav class="nav">
        <a href="/">Games</a>
        <a href="/community.html">Community</a>
        <a href="/admin.html" class="active">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:30px">
    <!-- Login -->
    <div id="login" class="card" style="max-width:420px;margin:40px auto">
      <h3>Admin Login</h3>
      <label>Admin Key</label>
      <input id="adminKey" type="password" placeholder="Enter admin key" />
      <button class="btn" onclick="adminLogin()">Enter Control Room</button>
    </div>

    <!-- Panel -->
    <div id="panel" style="display:none">
      <!-- Manage Games -->
      <div style="text-align:center"><span class="section-title">🎮 Manage Games</span></div>
      <div class="card">
        <div class="row">
          <div><label>Game Name</label><input id="gName" placeholder="e.g. Carrom" /></div>
          <div><label>Emoji / Icon</label><input id="gEmoji" placeholder="e.g. 🔴" maxlength="4" /></div>
        </div>
        <label>Description</label>
        <input id="gDesc" placeholder="Short description" />
        <button class="btn" onclick="addGame()">Add Game</button>
        <div id="gamesList" style="margin-top:18px"></div>
      </div>

      <div style="text-align:center"><span class="section-title">Add Player</span></div>
      <div class="card">
        <div class="row">
          <div><label>Player Name</label><input id="pName" placeholder="e.g. Sandeep Singh Sachdeva" /></div>
          <div><label>Organisation</label><input id="pOrg" placeholder="e.g. Snapdeal" /></div>
        </div>
        <button class="btn" onclick="addPlayer()">Add Player</button>
        <div id="playersList" style="margin-top:18px"></div>
      </div>

      <div style="text-align:center"><span class="section-title">Add Match</span></div>
      <div class="card">
        <label>Game</label>
        <select id="mGame"></select>
        <div class="row" style="margin-top:10px">
          <div><label>Player A</label><select id="mA"></select></div>
          <div><label>Player B</label><select id="mB"></select></div>
        </div>
        <div class="row">
          <div><label>Time Slot</label><input id="mTime" placeholder="e.g. 1:30 PM - 2:00 PM" /></div>
          <div><label>Day</label><input id="mDay" placeholder="Today" value="Today" /></div>
        </div>
        <label>Location</label>
        <input id="mLoc" placeholder="e.g. Sky Deck - Tower A" />
        <button class="btn" onclick="addMatch()">Add Match</button>
      </div>

      <div style="text-align:center"><span class="section-title">Manage Matches & Results</span></div>
      <div class="card">
        <label>Filter by game</label>
        <select id="matchGameFilter" onchange="loadAdminData()"></select>
        <div id="adminMatches" style="margin-top:14px"></div>
      </div>

      <div style="text-align:center"><span class="section-title">💬 Community Moderation</span></div>
      <div class="card">
        <p style="color:var(--muted);font-size:13px;margin-bottom:12px">Pending posts are hidden from the public feed until you approve them.</p>
        <div id="modQueue"></div>
      </div>

      <div style="text-align:center;margin-bottom:40px">
        <button class="btn ghost" onclick="adminLogout()">Log Out</button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/app.js?v=11"></script>
  <script>initAdmin();</script>
</body>
</html>
