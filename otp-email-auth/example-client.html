<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Login Example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; }
    input, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 15px; box-sizing: border-box; }
    button { cursor: pointer; }
    .hidden { display: none; }
    #status { margin-top: 16px; color: #333; }
    .who { padding: 10px; background: #f2f7f2; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Email OTP Login</h2>

  <!-- Step 1: email -->
  <div id="stepEmail">
    <input id="email" type="email" placeholder="you@yourcompany.com" />
    <button onclick="requestOtp()">Send code</button>
  </div>

  <!-- Step 2: code -->
  <div id="stepCode" class="hidden">
    <p>Enter the 6-digit code sent to <b id="sentTo"></b></p>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="123456" />
    <button onclick="verifyOtp()">Verify</button>
  </div>

  <!-- Logged in -->
  <div id="stepDone" class="hidden">
    <div class="who">Logged in as <b id="meEmail"></b></div>
    <button onclick="callProtected()">Call protected /api/me</button>
    <button onclick="logout()">Log out</button>
    <pre id="apiResult"></pre>
  </div>

  <div id="status"></div>

  <script>
    const API = ""; // same origin
    const show = (id) => {
      ["stepEmail", "stepCode", "stepDone"].forEach((s) =>
        document.getElementById(s).classList.toggle("hidden", s !== id));
    };
    const status = (m) => (document.getElementById("status").textContent = m || "");

    // token persists across reloads; survives incognito re-login only if same email
    const getToken = () => localStorage.getItem("auth_token");
    const setToken = (t, e) => { localStorage.setItem("auth_token", t); localStorage.setItem("auth_email", e); };
    const clearToken = () => { localStorage.removeItem("auth_token"); localStorage.removeItem("auth_email"); };

    async function post(path, body) {
      const r = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    async function requestOtp() {
      status("");
      const email = document.getElementById("email").value.trim();
      try {
        const r = await post("/api/auth/request-otp", { email });
        document.getElementById("sentTo").textContent = r.email;
        window._email = r.email;
        show("stepCode");
      } catch (e) { status(e.message); }
    }

    async function verifyOtp() {
      status("");
      const code = document.getElementById("code").value.trim();
      try {
        const r = await post("/api/auth/verify-otp", { email: window._email, code });
        setToken(r.token, r.email);
        renderLoggedIn();
      } catch (e) { status(e.message); }
    }

    async function callProtected() {
      try {
        const r = await fetch(API + "/api/me", {
          headers: { Authorization: "Bearer " + getToken() },
        });
        document.getElementById("apiResult").textContent = JSON.stringify(await r.json(), null, 2);
      } catch (e) { status(e.message); }
    }

    function renderLoggedIn() {
      document.getElementById("meEmail").textContent = localStorage.getItem("auth_email") || "";
      show("stepDone");
    }
    function logout() { clearToken(); show("stepEmail"); }

    // auto-restore session on load
    if (getToken()) renderLoggedIn(); else show("stepEmail");
  </script>
</body>
</html>
